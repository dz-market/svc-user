service_name: svc-user
shutdown_timeout: 10s

grpc:
    addr: "${env:GRPC_ADDR}"
    reflection: "${env:GRPC_REFLECTION:-false}"
    max_recv_msg_size: 1MB
    keepalive:
        max_connection_age: 30m
        max_connection_age_grace: 10m

auth_service:
    addr: "${env:AUTH_SERVICE_ADDR}"

postgres:
    dsn: "${env:POSTGRES_DSN}"
    max_conns: 10
    min_conns: 2
    max_conn_lifetime: 1h
    max_conn_idle_time: 30m
    health_check_period: 1m
    connect_timeout: 5s
    ping_timeout: 2s

kafka:
    brokers: ["${env:KAFKA_BROKERS}"]
    topics:
        user_registered: "${env:KAFKA_TOPIC_USER_REGISTERED:-auth.user-registered.v1}"

health:
    period: 5s
    timeout: 2s

log:
    level: info
    format: text