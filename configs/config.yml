service_name: svc-user
shutdown_timeout: 10s

grpc:
    addr: ${GRPC_ADDR}
    reflection: ${GRPC_REFLECTION:-false}

postgres:
    dsn: "${POSTGRES_DSN}"
    max_conns: 10
    min_conns: 2
    max_conn_lifetime: 1h
    max_conn_idle_time: 30m
    health_check_period: 1m
    connect_timeout: 5s
    ping_timeout: 2s

kafka:
    brokers: ["${KAFKA_BROKERS}"]
    consumer:
        client_id: "${KAFKA_CONSUMER_CLIENT_ID:-}"
        group_id: "${KAFKA_CONSUMER_GROUP_ID:-}"
        min_retry_delay: 1s
        max_retry_delay: 30s
        commit_timeout: 10s
    topics:
        user_registered: "${KAFKA_TOPIC_USER_REGISTERED:-auth.user-registered.v1}"

log:
    level: info
    format: text